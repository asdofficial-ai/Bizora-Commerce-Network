name: V1 CI

on:
  push:
    branches:
      - build/v1-midpoint
      - build/v1-75
      - build/v1-75-support
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Check server syntax
        run: npm run check:server
      - name: Build application
        run: npm run build
